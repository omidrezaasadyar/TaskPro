name: Build APK

on:
  push:
    branches:
      - "claude/**"
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Capture build error
        if: failure()
        run: |
          echo "## Build failed — compiler output (errors only)" > build-error.md
          echo '```' >> build-error.md
          # Surface the most useful lines: Kotlin/Java errors, "e:", "error:", "FAILURE", "What went wrong".
          grep -nE "e: |error: |> Task .*FAILED|FAILURE:|What went wrong|Caused by|Unresolved reference|Compilation error" build.log \
            | head -n 120 >> build-error.md || tail -n 120 build.log >> build-error.md
          echo '```' >> build-error.md

      - name: Publish build error to a release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-error
          name: TaskPro — last build error
          body_path: build-error.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskpro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to a rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: TaskPro — latest debug build
          body: |
            Automated debug build of TaskPro.
            Download `app-debug.apk` below and install it on your Android device
            (enable "Install unknown apps" for your browser/file manager first).
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
